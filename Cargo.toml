[workspace]
members = ["crates/*"]
# Every member is a default member: none carries a dependency heavy enough to be
# worth excluding from a plain `cargo build`/`cargo test`, and the bench binary
# is the only thing that hosts the libraries today, so it must build in the
# default lane.
#
# A virtual manifest has no edition of its own to infer a resolver from, so the
# resolver is stated. v3 is what edition 2024 selects; naming it here keeps the
# workspace from silently resolving under v2 rules that no member wants.
resolver = "3"

[workspace.package]
# Single source of truth for edition and license; every member manifest says
# `edition.workspace = true` and `license.workspace = true`. The edition must
# agree with the rustfmt edition flag in .claude/hooks/format.sh, or the editor
# hook formats against a different language version than the gate checks.
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
# Derived `Display`/`Error` for every library error type. The libraries here
# return typed errors for conditions that must never become a clamp, a saturated
# value, or a NaN, so the error enums are load-bearing and there are a lot of
# them.
thiserror = "2"
# f64 linear algebra for the head kinematics: rigid transforms, rotations, and
# the small dense solve at the centre of the forward-kinematics iteration.
# reachy-kin only — nothing above it needs a matrix.
nalgebra = "0.35"
# Serial port access for the servo bus, and the only I/O dependency in the
# workspace. `default-features = false` drops the udev-backed enumeration
# support: the port is named in configuration, never discovered, so the extra
# native dependency would buy nothing and cost a build prerequisite.
serialport = { version = "4", default-features = false }
# Error reporting at the binary edge only, where a chain of context is what an
# operator at a bench actually wants. Libraries use thiserror.
anyhow = "1"
# The bench binary's configuration file: bus device, envelope caps, motion
# parameters, arm thresholds, and the resolved crank datum.
serde = { version = "1", features = ["derive"] }
toml = "1"
