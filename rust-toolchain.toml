# The toolchain for host builds and `make check`. Stable: nothing here needs a
# nightly feature.
#
# The binary that runs on the device is not built with this. It is
# cross-compiled inside the pinned builder container under `containers/`, which
# sets its own toolchain version deliberately overriding this channel, so that
# the binary links against the device image's own C library.
#
# rustfmt and clippy are named because `make check` runs both and a bare rustup
# install does not necessarily carry them.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
