[package]
name = "reachy-wire"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Packed little-endian datagram codec for the Reachy motion bus: pose samples, driver events, goal setpoints, control"

# No dependencies, on purpose. This crate is the single statement of a byte
# layout that a driver process, a Clockwork cog body and a Python log checker
# all have to agree on, and the fewer things it drags into any of those, the
# fewer reasons any of them has to disagree. Errors are a plain enum with a
# hand-written Display rather than a derive, for the same reason.
[dependencies]

# Test-only, and for one assertion: the row count and the mask bit positions
# stated in this crate are a restatement of `JointId`, and this is what compares
# the two rather than trusting two files to stay equal. Nothing on the codec
# path may name it, so it stays in this section.
[dev-dependencies]
reachy-motion = { path = "../reachy-motion" }
