[package]
name = "reachy-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The motor driver's goal gate and dead-man timer as pure data and pure functions, hostable anywhere"

# No newtypes from anywhere else in the workspace: times are plain i64
# nanoseconds, positions plain f64 arrays, joint sets plain u16. This logic has
# to run inside the driver process, inside a simulated driver in a Clockwork
# cog, and inside plain unit tests, and it is mirrored field for field into a
# Clockwork state schema — every one of which a newtype from a neighbouring
# crate would make harder for no gain here.
#
# The single exception is the wire layout, which is itself dependency-free plain
# data of exactly these types and is how every host receives the goals this gate
# queues. Restating its row count and its setpoint's fields here instead would
# be two statements of one contract, each hand-copied into the gate by whoever
# hosts it.
[dependencies]
reachy-wire = { path = "../reachy-wire" }
