# reachy-bench.example.toml — every key the bench reads, at its default.
#
# Copy this beside the binary and change what your unit needs. Every key written
# here is at its default, so deleting one changes nothing and the file doubles as
# the documentation of what omitting it means. The exception is `[datum]`: it has
# no default, it is commented out below, and a human writes it in from a
# self-test record.
#
# The bench talks to hardware and moves nothing. There is no motion, envelope or
# settle table here: coordinated motion runs in the cog system, configured by its
# own schema-typed parameter files. A key with no consumer in this binary would
# read as a bound something enforces, so this file carries none.
#
# Angles are degrees and rates are hertz — the units a person reasons in. The
# libraries take radians and the conversion happens on load.

[bus]
# The serial node the nine servos share. The platform's own documentation names
# this one; the first read-only run is what confirms it on your machine.
device = "/dev/ttyAMA3"
baud = 1000000
# Slack over the wire time for a request-response exchange: the servo's own
# turnaround plus host scheduling jitter. Provisional — the shape of the open
# budget for this kind of bus, not a measurement of this host. A ping is 24 bytes
# end to end, 240 microseconds at this rate, so this figure dominates the
# deadline and is the number to compare a measured sweep against.
host_allowance_ms = 10
# Total attempts a retried operation makes, the first included. Only a timeout is
# ever retried; a corrupt frame fails immediately and is never retried.
retry_attempts = 5
retry_spacing_ms = 20
# Bus order: body yaw, legs 1..=6, right antenna, left antenna. Every nine-slot
# array in this file is in this order.
servo_ids = [10, 11, 12, 13, 14, 15, 16, 17, 18]

[arm]
# Two thresholds a reading is judged against, named for the arm gate they were
# sized for. Neither gates anything here: the registry reports the case and
# writes the verdict into its record.
#
# The supply floor a rail reading is judged against. Provisional: a round number
# above the servos' own minimum-voltage alarm and below anything a healthy supply
# should sag to, chosen with a margin rather than measured. What matters is the
# sag while nine servos take up the head's weight, which nobody has recorded.
min_arm_voltage = 6.0
# How far a limp servo's goal register may sit from its measured position. With
# torque off these servos report their goal as their present position, and the
# self-test's goal-shadow case is what checks that they do. A diagnostic, not a
# gate: nothing on the engage path consults it. Twenty-odd times the one count of
# read wobble the register was observed to have.
goal_shadow_tolerance_deg = 2.0

[provision]
# What the servos must already hold for this project to command them at all.
# Register contents as a data sheet states them, not engineering units: integers
# a person compares against how the unit was set up. The sweep verifies these and
# repairs none of them.
return_delay_time = 0
# The operating mode is deliberately not a key here. It differs per servo — the
# body and the legs in single-turn position mode, the two antennas in extended
# position, which is what makes a free-turning antenna reachable the short way
# from anywhere — and it is not an operator's to choose, so the nine expected
# modes are baked into the library and checked on every servo before anything is
# written or enabled. `reachy-bench provision` is what writes the antennas'.
drive_mode = 0
# Zero, which is the register disabled -- and the provisioned baseline rather
# than what a running machine holds. A motion session arms it at its configured
# timeout on every commissioning sweep; the register lives in RAM and resets to 0
# at power-on, so this expectation is exact after a power cycle and only then.
# Hence the read-only sweep's power-cycle precondition: a sweep taken after a
# motion session without one reads the session's timeout here and fails, and that
# failure means the precondition was skipped, not that the unit is provisioned
# wrong.
bus_watchdog = 0
temperature_limit = 70
# Tenths of a volt.
max_voltage_limit = 70
min_voltage_limit = 35
# Per servo in bus order, because the roster is not all one part. This unit reads
# the same untouched factory ceiling on all nine: nothing in the vendor's
# configuration writes a current limit, so what the servos hold is what they
# shipped with.
current_limit = [1750, 1750, 1750, 1750, 1750, 1750, 1750, 1750, 1750]
# The profile registers are deliberately not keys here. Whatever arms this machine
# writes them at every arm and verifies its own write, and they live in RAM that
# holds until power comes off — so the only value a key here could state is the
# power-on one, which stops being true as soon as this machine has armed once.
# They are read and reported by the sweep instead: a nonzero reading says the
# machine has not been power-cycled since its last arm.
#
# The homing offsets are deliberately not a key here. They are the datum — the
# servo applies its own offset before reporting a position, so a converted count
# is the model's crank angle exactly when they hold what the vendor wrote — and
# a datum is not a per-unit setting to be edited. The nine expected values are
# baked in code, and a servo answering otherwise is a provisioning fault to be
# repaired with the vendor's tool.
#
# The per-leg window the servo itself refuses to be commanded past, counts, legs
# 1..=6. The servo-side fence: whatever commands this machine holds a per-leg
# crank window of its own, and the two have to be guarding one region. Mapped
# through the servo map, these are that window to within one count.
leg_position_limits = [
    [1502, 2958],
    [1138, 2844],
    [1502, 2958],
    [1138, 2594],
    [1252, 2958],
    [1138, 2594],
]

# [datum] — absent from a fresh configuration, and nothing converts a count to a
# model angle without it. That a converted count is the model's crank angle rests
# on every servo carrying its provisioned homing offset: the self-test's datum case
# reads all nine back and compares them, and whatever arms this machine
# re-verifies them before it enables anything. This table is not that check — it is the record
# that a person read a run and stands behind what it says.
#
# It is commented out rather than filled in, so as shipped this file has no datum
# to hand a host that asks for one. That is the intended state: an example cannot
# have read your unit's run, and a value copied from here would be a review
# nobody performed standing where the review is supposed to be.
# Uncomment both lines and write your own note.
#
# [datum]
# crank_datum = "direct"          # the only reading; anything else is refused
# provenance = "who reviewed it, when, and from which self-test record"
