[package]
name = "reachy-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bench binary for Reachy Mini bring-up: read-only self-test registry and supervised motion commands"

[dependencies]
# The port and the transactions. This binary owns the pump loop that drives the
# sequencers and the tick, so it is the one place the I/O layer and the sans-I/O
# layers are joined.
reachy-bus = { path = "../reachy-bus" }
# The tick, the trajectories, and the arm/disarm sequencers this binary drives.
reachy-motion = { path = "../reachy-motion" }
# The motion library: the clip and sequence assets `play` reads, the player that
# clocks one, and the compositor that lays it over a base. The same code the
# daemon loads its library with, so a clip that plays here plays there.
reachy-clips = { path = "../reachy-clips" }
# Poses, geometry and envelope configuration for the self-test cases that compute
# resting-pose kinematics and clearance margins without commanding anything.
reachy-kin = { path = "../reachy-kin" }
# Register names and count conversions, needed to map the motion layer's abstract
# requests onto the wire and to run the read-only register sweeps.
dxl-proto = { path = "../dxl-proto" }
# Error reporting at the binary edge, where a chain of context is what an operator
# at a bench wants. The libraries use thiserror.
anyhow = { workspace = true }
# Typed refusals for a configuration that cannot be used: a missing crank datum,
# a servo roster that is not nine distinct servos, two per-leg fences that
# describe different regions. Each is a named refusal rather than a substituted
# value, so they are error enums like every other crate's.
thiserror = { workspace = true }
# The configuration file: bus device, envelope caps, motion parameters, arm
# thresholds, and the resolved crank datum.
serde = { workspace = true }
toml = { workspace = true }
